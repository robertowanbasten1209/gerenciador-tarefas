<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Gerenciador de Tarefas</h1>

    <ul>
        {% for id, titulo, concluida in tarefas %}
            <li>
                {{id}} - {{titulo}} x 
                    {% if concluida == 1 %}
                        Concluida
                    {% else %}
                        Pendente
                    {% endif %}
            </li>
        {% endfor %}
    </ul>
</body>
</html>
